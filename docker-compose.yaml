services:
    web:
        build:
            context: web
        env_file:
            - web/.env
        ports:
            - "3000:3000"
        depends_on:
            - backend
            - keycloak

    backend:
        build:
            context: backend
        env_file:
            - backend/.env
        depends_on:
            - db
        ports:
            - "8080:8080"

    db:
        image: postgres:17
        container_name: postgres_db
        env_file:
            - infra/.env
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./infra/postgres/init-keycloak.sql:/docker-entrypoint-initdb.d/01-init-keycloak.sql:ro
    
    keycloak:
        image: quay.io/keycloak/keycloak:26.8.0
        command: start-dev
        env_file:
            - infra/.env
        ports:
            - "127.0.0.1:8081:8080"
        depends_on:
            - db

volumes:
    postgres_data: