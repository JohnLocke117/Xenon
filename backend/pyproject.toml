[project]
name = "Xenon"
version = "0.0.0"
description = "A Complete Knowledge OS"
readme = "README.md"
authors = [
    { name = "Varun", email = "varunarya119@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "colorlog>=6.12.0",
    "fastapi>=0.141.1",
    "psycopg2>=2.9.12",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle Errors
    "F",   # Pyflakes
    "I",   # Import sorting
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.14"
pretty = true
show_error_codes = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true

# Packages / modules to check
files = ["main.py", "src"]

# Alembic revision scripts are generated; skip them
exclude = ["alembic/versions/"]
plugins = [
    "pydantic.mypy",
]
